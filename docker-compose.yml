services:
  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: es_container
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c '</dev/tcp/localhost/9200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_init:
    build: .
    container_name: fastapi_db_init
    dns:
      - 8.8.8.8
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////code/db/fastapi.db
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=posts_index
    volumes:
      - sqlite_data:/code/db
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: sh -c "python -m alembic upgrade head && python import_csv.py"

  web:
    build: .
    container_name: fastapi_web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////code/db/fastapi.db
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=posts_index
    volumes:
      - sqlite_data:/code/db
    depends_on:
      db_init:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  sqlite_data:
  es_data: